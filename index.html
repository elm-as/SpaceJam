<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceJam — Collision Galactique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        canvas { display: block; }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 16px 20px;
            width: 260px;
            /* max-height est géré dynamiquement par UI.js selon la hauteur de l'écran */
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 100;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }

        #controls::-webkit-scrollbar { width: 4px; }
        #controls::-webkit-scrollbar-track { background: transparent; }
        #controls::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        #controls h2 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 14px;
            position: sticky;
            top: -16px;
            padding-top: 6px;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1;
        }

        .section-label {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.25);
            margin: 12px 0 8px 0;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.7);
        }

        .control-group label span.value {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-variant-numeric: tabular-nums;
            font-size: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.85);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .btn:active { transform: scale(0.97); }

        .btn.primary {
            background: rgba(255, 130, 40, 0.15);
            border-color: rgba(255, 130, 40, 0.25);
            color: rgba(255, 180, 100, 0.95);
        }

        .btn.primary:hover {
            background: rgba(255, 130, 40, 0.25);
        }

        .btn.active {
            background: rgba(100, 140, 255, 0.15);
            border-color: rgba(100, 140, 255, 0.3);
            color: rgba(140, 170, 255, 0.95);
        }

        .btn.danger {
            background: rgba(255, 50, 50, 0.12);
            border-color: rgba(255, 50, 50, 0.2);
        }

        .btn.danger:hover {
            background: rgba(255, 50, 50, 0.2);
        }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        .btn-row .btn {
            flex: 1;
            margin-bottom: 5px;
        }

        /* Mode compact (petits écrans) */
        #controls.compact .section-label { margin: 6px 0 4px 0; font-size: 9px; }
        #controls.compact .control-group { margin-bottom: 6px; }
        #controls.compact .btn { padding: 6px 10px; margin-bottom: 3px; font-size: 11px; }
        #controls.compact h2 { margin-bottom: 8px; font-size: 10px; }
        #controls.compact .control-group label { font-size: 11px; margin-bottom: 3px; }

        #stats {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 18px 22px;
            min-width: 220px;
            z-index: 100;
        }

        #stats h2 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 14px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 3px 0;
        }

        .stat-row .label {
            font-size: 11.5px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
        }

        .stat-row .val {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat-row .val.fps    { color: #34d399; }
        .stat-row .val.energy { color: #60a5fa; }
        .stat-row .val.count  { color: #c084fc; }

        #mode-indicator {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            z-index: 100;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 160, 80, 0.9);
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        #mode-indicator.active { opacity: 1; }

        #instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 18px;
            z-index: 100;
            font-size: 11px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="controls" class="glass">
        <h2>Contrôles</h2>

        <div class="section-label">Création</div>
        <div class="btn-row">
            <button class="btn primary" id="btn-spiral">Spirale</button>
            <button class="btn primary" id="btn-barred">Barrée</button>
        </div>
        <div class="btn-row">
            <button class="btn primary" id="btn-elliptical">Elliptique</button>
            <button class="btn primary" id="btn-lenticular">Lenticulaire</button>
        </div>
        <div class="btn-row">
            <button class="btn primary" id="btn-irregular">Irrégulière</button>
            <button class="btn primary" id="btn-random">Aléatoire</button>
        </div>
        <div class="btn-row">
            <button class="btn" id="btn-add-bh" style="border-color: #a855f7; color: #d8b4fe;">Trou Noir</button>
            <button class="btn" id="btn-add-star" style="border-color: #60a5fa; color: #bfdbfe;">Étoile Libre</button>
        </div>
        <button class="btn" id="btn-preset">Scénario Collision</button>

        <div class="section-label">Paramètres</div>
        <div class="control-group">
            <label>Gravité (G) <span class="value" id="g-value">1,00</span></label>
            <input type="range" id="g-slider" min="0.1" max="5" step="0.05" value="1">
        </div>
        <div class="control-group">
            <label>Rotation (tscale) <span class="value" id="time-value">1,0x</span></label>
            <input type="range" id="time-slider" min="0.1" max="10" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Vitesse animation <span class="value" id="anim-value">1,0x</span></label>
            <input type="range" id="anim-slider" min="0.1" max="5" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Bloom <span class="value" id="bloom-value">2,00</span></label>
            <input type="range" id="bloom-slider" min="0" max="4" step="0.05" value="2">
        </div>
        <div class="control-group">
            <label id="bhmass-label">Masse Nv. TN <span class="value" id="bhmass-value">1000</span></label>
            <input type="range" id="bhmass-slider" min="100" max="10000" step="100" value="1000">
        </div>

        <div class="section-label">Simulation</div>
        <button class="btn" id="btn-pause">Pause</button>
        <div class="btn-row">
            <button class="btn" id="btn-step">Step</button>
            <button class="btn" id="btn-tides">Marées: ON</button>
        </div>
        <button class="btn" id="btn-focus">Focus Galaxie</button>
        <button class="btn" id="btn-trails">Afficher Trajectoires</button>
        <button class="btn" id="btn-invert">Inverser le Temps</button>
        <button class="btn" id="btn-perf-mode" style="border-color: #fbbf24; color: #fde68a;">Mode Perf: OFF</button>
        <button class="btn primary" id="btn-multi">Scène Multi (10)</button>
        <button class="btn danger" id="btn-reset">Réinitialiser</button>
    </div>

    <div id="stats" class="glass">
        <h2>Télémétrie</h2>
        <div class="stat-row">
            <span class="label">FPS</span>
            <span class="val fps" id="stat-fps">0</span>
        </div>
        <div class="stat-row">
            <span class="label">Galaxies</span>
            <span class="val count" id="stat-galaxies">0</span>
        </div>
        <div class="stat-row">
            <span class="label">Étoiles</span>
            <span class="val count" id="stat-particles">0</span>
        </div>
        <div class="stat-row">
            <span class="label">Trous Noirs</span>
            <span class="val" id="stat-bh">0</span>
        </div>
        <div class="stat-row">
            <span class="label">Énergie</span>
            <span class="val energy" id="stat-energy">0</span>
        </div>
        <div class="stat-row">
            <span class="label">Durée</span>
            <span class="val" id="stat-time">0:00</span>
        </div>
    </div>

    <div id="mode-indicator" class="glass"></div>

    <div id="instructions" class="glass">
        Z/S : zoom &middot; Q/D : rotation &middot; E/A : haut/bas &middot; F : focus &middot; TAB : switch galaxie<br>
        Clic gauche : rotation &middot; Clic droit : translation
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
